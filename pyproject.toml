[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quakeflow"
version = "0.1.0"
description = "Incremental ELT pipeline for global earthquake data: USGS API -> DuckDB -> dbt -> Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "pydantic>=2.6",
    "requests>=2.31",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20", "pandas>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
quakeflow = "quakeflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs dbt against a real DuckDB file (slower)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
